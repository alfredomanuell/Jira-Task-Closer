<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <title>Jira Task Closer</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div>
      <h1>Tarefas abertas</h1>
      <div id="account" class="label"></div>
    </div>
    <div class="actions">
      <button id="refresh" title="Atualizar">&#8635;</button>
      <button id="open-options" title="Opções">&#9881;</button>
    </div>
  </header>

  <section id="current" hidden>
    <div class="label">Tarefa desta página</div>
    <div id="current-issue"></div>
  </section>

  <div id="autoclose" class="label"></div>
  <div id="message" class="message" hidden></div>
  <ul id="issues"></ul>

  <template id="issue-row">
    <li class="issue">
      <div class="info">
        <a class="key" target="_blank" rel="noopener"></a>
        <span class="status"></span>
        <span class="remaining" hidden></span>
        <div class="summary"></div>
      </div>
      <div class="controls">
        <select class="transition" hidden></select>
        <button class="close">Fechar</button>
      </div>
    </li>
  </template>

  <script type="module" src="popup.js"></script>
</body>
</html>
